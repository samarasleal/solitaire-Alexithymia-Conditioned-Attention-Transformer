project:
  name: "CoLA-Trait"
  description: "Trait-conditioned longitudinal attention for speech-based prediction of depression outcomes"

paths:
  clinical_data: "data/clinical_data.xlsx"
  logmel_root: "data/logMel"
  cnn_embeddings_root: "data/cnn_segment_embeddings"
  wav2vec_embeddings_root: "data/wav2vec_embeddings"
  results_root: "results"

columns:
  patient: "Patient_ID"
  session: "Session"
  logmel: "logMel_npy"
  cnn_embedding: "CNN_SegEmb_npy"
  wav2vec_embedding: "Embedding_npy"
  alexithymia: "Alexithymia_T0"
  binary_target: "Y_Binary_Classe_Delta_Y"
  regression_target: "Y_Standardized_T1"

representation:
  type: "cnn"
  cnn_input_dim: 128
  wav2vec_input_dim: 768
  common_embedding_dim: 128
  segment_pooling: "attention"

model:
  name: "COLA"
  mode: "trait"
  trait_source: "alex"
  trait_dim: 128
  attention_dim: 128
  dropout: 0.2

training:
  epochs: 20
  batch_size: 2
  learning_rate: 0.0003
  alexithymia_loss_weight: 0.05
  device: "cuda"

evaluation:
  protocol: "leave-one-patient-out"
  seeds: [42, 123, 2026]
  binary_threshold: 0.5
  bootstrap_iterations: 5000
  confidence_level: 0.95